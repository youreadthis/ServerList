<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f2">
  <title>Серверы — Серверная</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="scripts/app.js" defer></script>
</head>
<body data-page="servers">
  <header class="navbar site-header py-2"><div class="container-xl header-inner d-flex align-items-center justify-content-between">
    <a class="navbar-brand brand d-inline-flex align-items-center gap-2" href="index.html" aria-label="Серверная, главная"><span class="brand-mark d-flex align-items-center justify-content-center"><i data-lucide="gamepad-2"></i></span><span>серверная<span class="brand-period">.</span></span></a>
    <nav class="navbar-nav flex-row main-nav gap-2 gap-sm-4 align-self-stretch" aria-label="Основная навигация"><a class="nav-link d-inline-flex align-items-center" href="index.html">Главная</a><a class="nav-link d-inline-flex align-items-center active" href="servers.html" aria-current="page">Серверы</a></nav>
    <a class="account-link d-inline-flex align-items-center gap-0 gap-sm-3" href="account.html" aria-label="Личный кабинет"><span class="account-link-label">Личный кабинет</span><span class="account-icon d-flex align-items-center justify-content-center"><i data-lucide="user-round"></i></span></a>
  </div></header>

  <main class="container-xl page-shell catalog-page">
    <section class="catalog-heading">
      <p class="eyebrow"><span class="live-dot"></span> Каталог сообщества</p>
      <div class="catalog-title-row d-flex align-items-end justify-content-between gap-3"><div><h1>Найди свою<br><span>игру.</span></h1></div><p>Свежие миры, живые сообщества<br>и новые поводы остаться ещё на час.</p></div>
    </section>

    <section class="catalog-controls d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3" aria-label="Поиск и фильтры серверов">
      <label class="search-box d-flex flex-grow-1 align-items-center gap-2"><i data-lucide="search"></i><input class="form-control" id="server-search" type="search" placeholder="Название сервера или игры" autocomplete="off"><kbd class="d-flex align-items-center justify-content-center">/</kbd></label>
      <div class="filter-row btn-group flex-wrap gap-1" role="group" aria-label="Фильтр по игре">
        <button class="btn btn-dark filter-chip" type="button" data-filter="all" aria-pressed="true">Все игры</button>
        <button class="btn btn-outline-dark filter-chip" type="button" data-filter="Minecraft" aria-pressed="false">Minecraft</button>
        <button class="btn btn-outline-dark filter-chip" type="button" data-filter="Rust" aria-pressed="false">Rust</button>
        <button class="btn btn-outline-dark filter-chip" type="button" data-filter="CS2" aria-pressed="false">CS2</button>
      </div>
    </section>

    <div class="results-heading d-flex justify-content-between"><span>СЕРВЕРЫ</span><span id="result-count">0 результатов</span></div>
    <section class="server-grid catalog-grid row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-3" data-server-list="catalog" aria-live="polite"></section>
  </main>
  <footer class="site-footer"><div class="container-xl d-flex align-items-center justify-content-between flex-wrap"><a class="brand footer-brand d-inline-flex align-items-center gap-2" href="index.html"><span>серверная<span class="brand-period">.</span></span></a><span class="footer-tagline">Играй вместе. Открывай новое.</span><a class="d-inline-flex align-items-center gap-1" href="account.html">Личный кабинет <i data-lucide="arrow-up-right"></i></a><span class="footer-rights">© 2026 Серверная. Все права защищены.</span></div></footer>
</body>
</html>
