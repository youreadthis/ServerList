<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f2">
  <title>Регистрация — Серверная</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="scripts/app.js" defer></script>
</head>
<body data-page="register">
  <header class="navbar site-header"><div class="container-xl header-inner">
    <a class="navbar-brand brand" href="index.html" aria-label="Серверная, главная"><span class="brand-mark"><i data-lucide="gamepad-2"></i></span><span>серверная<span class="brand-period">.</span></span></a>
    <nav class="navbar-nav flex-row main-nav" aria-label="Основная навигация"><a class="nav-link" href="index.html">Главная</a><a class="nav-link" href="servers.html">Серверы</a></nav>
    <a class="account-link is-current" href="account.html" aria-label="Личный кабинет"><span class="account-link-label">Личный кабинет</span><span class="account-icon"><i data-lucide="user-round"></i></span></a>
  </div></header>

  <main class="container-xl page-shell register-page row align-items-center g-4 g-lg-5">
    <section class="col-md-6 register-visual">
      <div class="register-visual-image"><img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1200&q=85" alt="Игроки на киберспортивном турнире"><span class="register-image-tag">ИГРАЙ СВОИМ СОСТАВОМ</span></div>
      <p>Точка входа<br>в новые <span>миры.</span></p>
    </section>
    <section class="col-md-5 offset-md-1 register-form-section">
      <p class="eyebrow">Добро пожаловать</p>
      <h1>Создай<br>аккаунт<span>.</span></h1>
      <p class="form-intro">Один аккаунт для твоих серверов и игровых сообществ.</p>
      <form id="register-form">
        <div class="mb-3"><label class="form-label" for="account-name">Имя аккаунта</label>
        <input class="form-control" id="account-name" name="name" type="text" placeholder="Например, PixelFox" minlength="2" maxlength="24" autocomplete="username" required></div>
        <div class="mb-3"><label class="form-label" for="account-email">Электронная почта</label>
        <input class="form-control" id="account-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required></div>
        <div class="mb-3"><label class="form-label" for="account-password">Пароль</label>
        <input class="form-control" id="account-password" name="password" type="password" placeholder="Не менее 8 символов" minlength="8" autocomplete="new-password" required></div>
        <button class="btn btn-primary button register-submit w-100" type="submit">Зарегистрироваться <i data-lucide="arrow-right"></i></button>
        <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
      </form>
      <p class="login-prompt">Уже есть аккаунт? <a href="account.html">Личный кабинет <i data-lucide="arrow-up-right"></i></a></p>
    </section>
  </main>
  <footer class="site-footer"><div class="container-xl d-flex align-items-center justify-content-between"><a class="brand footer-brand" href="index.html"><span>серверная<span class="brand-period">.</span></span></a><span>Играй вместе. Открывай новое.</span><a href="servers.html">Каталог серверов <i data-lucide="arrow-up-right"></i></a></div></footer>
</body>
</html>
